name: Phase modules
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d outbox_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      OUTBOX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outbox_test
      OUTBOX_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:phases-2-4
      - run: npm run test --workspace=@mms/event-outbox
      - run: npm run build --workspace=frontend
