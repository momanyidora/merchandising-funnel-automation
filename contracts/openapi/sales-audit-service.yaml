openapi: 3.0.3
info: {title: Sales Audit Service, version: 1.0.0}
servers: [{url: http://localhost:3007}]
paths:
  /audits:
    get: {summary: List register reconciliations, responses: {'200': {description: Reconciliations}}}
    post:
      summary: Reconcile and close a register
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [storeName, registerName, cashierName, businessDate, counts, managerName, explanation], properties: {storeName: {type: string}, registerName: {type: string}, cashierName: {type: string}, businessDate: {type: string, format: date}, currency: {type: string, minLength: 3, maxLength: 3}, managerName: {type: string}, explanation: {type: string}, counts: {type: array, items: {type: object, required: [method, actual], properties: {method: {type: string, enum: [CASH, CARD, GIFT_CARD]}, actual: {type: integer, minimum: 0}}}}}}}}}
      responses: {'201': {description: Reconciled and closed}, '400': {description: Manager signoff or counts missing}}
