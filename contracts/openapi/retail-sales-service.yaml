openapi: 3.0.3
info: {title: Retail Sales Service, version: 1.0.0}
servers: [{url: http://localhost:3006}]
paths:
  /sales:
    get: {summary: List sales, responses: {'200': {description: Sales}}}
    post:
      summary: Reserve stock and record sale
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [storeId, registerId, cashierId, items, payments], properties: {storeId: {type: string}, registerId: {type: string}, cashierId: {type: string}, currency: {type: string}, items: {type: array, items: {type: object, required: [productId, quantity, unitPrice], properties: {productId: {type: string}, quantity: {type: integer, minimum: 1}, unitPrice: {type: integer, minimum: 0}, locationId: {type: string}}}}, payments: {type: array, items: {type: object, required: [method, amount], properties: {method: {type: string, enum: [CASH, CARD, GIFT_CARD]}, amount: {type: integer}}}}}}}}}
      responses: {'201': {description: Sale recorded}, '409': {description: Stock unavailable}}
