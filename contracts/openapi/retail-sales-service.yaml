openapi: 3.0.3
info: {title: Retail Sales Service, version: 1.0.0}
servers: [{url: http://localhost:3006}]
paths:
  /sales:
    get: {summary: List sales, responses: {'200': {description: Sales}}}
    post:
      summary: Reserve stock and record sale
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [storeName, registerName, cashierName, items, payments], properties: {storeName: {type: string}, registerName: {type: string}, cashierName: {type: string}, currency: {type: string}, businessDate: {type: string, format: date}, items: {type: array, items: {type: object, required: [productId, quantity, unitPrice, locationId], properties: {productId: {type: string, format: uuid}, quantity: {type: integer, minimum: 1}, unitPrice: {type: integer, minimum: 0}, locationId: {type: string, format: uuid}}}}, payments: {type: array, items: {type: object, required: [method, amount], properties: {method: {type: string, enum: [CASH, CARD, GIFT_CARD]}, amount: {type: integer, minimum: 0}}}}}}}}}
      responses: {'201': {description: Sale recorded}, '409': {description: Stock unavailable}}
