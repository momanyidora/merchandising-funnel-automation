services:
  vendor-postgres:
    image: postgres:16
    container_name: mms-vendor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor_db
      POSTGRES_USER: vendor_user
      POSTGRES_PASSWORD: vendor_password
    ports:
      - "5433:5432"
    volumes:
      - vendor_postgres_data:/var/lib/postgresql/data

  procurement-postgres:
    image: postgres:16
    container_name: mms-procurement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: procurement_user
      POSTGRES_PASSWORD: procurement_password
    ports:
      - "5434:5432"
    volumes:
      - procurement_postgres_data:/var/lib/postgresql/data

  inventory-postgres:
    image: postgres:16
    container_name: mms-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5435:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data

  receiving-postgres:
    image: postgres:16
    container_name: mms-receiving-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: receiving_db
      POSTGRES_USER: receiving_user
      POSTGRES_PASSWORD: receiving_password
    ports:
      - "5436:5432"
    volumes:
      - receiving_postgres_data:/var/lib/postgresql/data

  warehouse-postgres:
    image: postgres:16
    container_name: mms-warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
    ports:
      - "5437:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data

  retail-postgres:
    image: postgres:16
    container_name: mms-retail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail_db
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
    ports:
      - "5438:5432"
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data

  sales-audit-postgres:
    image: postgres:16
    container_name: mms-sales-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_audit_db
      POSTGRES_USER: sales_audit_user
      POSTGRES_PASSWORD: sales_audit_password
    ports:
      - "5439:5432"
    volumes:
      - sales_audit_postgres_data:/var/lib/postgresql/data

  financials-postgres:
    image: postgres:16
    container_name: mms-financials-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financials_db
      POSTGRES_USER: financials_user
      POSTGRES_PASSWORD: financials_password
    ports:
      - "5440:5432"
    volumes:
      - financials_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mms-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  vendor_postgres_data:
  procurement_postgres_data:
  inventory_postgres_data:
  receiving_postgres_data:
  warehouse_postgres_data:
  retail_postgres_data:
  sales_audit_postgres_data:
  financials_postgres_data: